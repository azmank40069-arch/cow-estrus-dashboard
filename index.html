<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriNode AI | Estrus Telemetry</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase, Chart.js, and Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#38bdf8', 600: '#0284c7' },
                        dark: { 900: '#0b1120', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar & Animations */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        #canvas-container { width: 100%; height: 450px; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .pulse-dot {
            height: 8px; width: 8px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 1);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 font-sans antialiased overflow-hidden flex h-screen">

    <aside class="w-64 bg-dark-800 border-r border-dark-700 flex-col hidden md:flex shrink-0 shadow-xl z-20">
        <div class="p-6 border-b border-dark-700 flex items-center gap-3">
            <div class="bg-brand-500/10 p-2 rounded-lg text-brand-500">
                <i class="fa-solid fa-cow text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">AgriNode AI</h1>
                <p class="text-xs text-brand-500 font-medium">Edge Telemetry</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="router('fleet')" id="nav-fleet" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors bg-brand-600 text-white shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-layer-group w-5"></i> Fleet Dashboard
            </button>
            <button onclick="router('hardware')" id="nav-hardware" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 hover:bg-dark-700 hover:text-white transition-colors">
                <i class="fa-solid fa-microchip w-5"></i> Hardware & Specs
            </button>
        </nav>
        <div class="p-4 border-t border-dark-700">
            <div class="flex items-center gap-2 text-sm text-emerald-400 bg-emerald-400/10 px-3 py-2 rounded-lg border border-emerald-500/20">
                <div class="pulse-dot bg-emerald-500"></div> System Online
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto overflow-x-hidden relative bg-[#0b1120]">
        <!-- Mobile Header -->
        <header class="md:hidden bg-dark-800 border-b border-dark-700 p-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cow text-brand-500"></i>
                <h1 class="font-bold text-white">AgriNode AI</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="router('fleet')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-lg"></i></button>
                <button onclick="router('hardware')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-microchip text-lg"></i></button>
            </div>
        </header>

        <div id="app-content" class="p-6 md:p-8 w-full max-w-7xl mx-auto min-h-full">
            <!-- Content injected via JS -->
            <div class="flex justify-center items-center h-64 w-full">
                <i class="fa-solid fa-circle-notch fa-spin text-brand-500 text-3xl"></i>
            </div>
        </div>
    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://fqvkjulnfmevufqxfyqt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_pfsmnN_CY5YWQPYRohZ-Yg_7o1wtNgZ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GLOBAL STATE ---
let scene, camera, renderer, animationId;
const DEMO = new URLSearchParams(location.search).has('demo');   // add ?demo=1 to the URL for sample data
let rows = [], status = {}, cows = {}, charts = [], curView = 'fleet', range = 36, filter = '';
const BEH = [['eating_minutes','Eating','#10b981'], ['lying_minutes','Lying','#64748b'],
  ['lying_rumination_minutes','Lying rumination','#f59e0b'],
  ['standing_rumination_minutes','Standing rumination','#d97706'], ['others_minutes','Active / other','#ef4444']];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rum = r => (+r.lying_rumination_minutes || 0) + (+r.standing_rumination_minutes || 0);
const sum = (a, f) => a.reduce((s, r) => s + (+f(r) || 0), 0);
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 6e4);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };
const lbl = d => { const t = new Date(d); return t.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
const pill = (t, c) => `<span class="${c} text-xs px-2.5 py-1 rounded-full font-bold border">${t}</span>`;
const STATE = { online: ['ONLINE','bg-emerald-500/10 border-emerald-500/20 text-emerald-500'],
  delayed: ['DELAYED','bg-amber-500/10 border-amber-500/30 text-amber-400'],
  offline: ['OFFLINE','bg-slate-500/10 border-slate-500/30 text-slate-400'] };
const HEAT = 'bg-red-500/20 border-red-500/50 text-red-400 animate-pulse';

// --- DATA ---
async function load() {
  try {
    if (DEMO) ({rows, status} = demo());
    else {
      const since = new Date(Date.now() - 8 * 864e5).toISOString(); let all = [], from = 0;
      for (;;) {
        const { data, error } = await supabaseClient.from('cow_behavior_summary').select('*')
          .gte('recorded_at', since).order('recorded_at', { ascending: false }).range(from, from + 999);
        if (error) throw error;
        all = all.concat(data); if (data.length < 1000) break; from += 1000;
      }
      rows = all; status = {};
      const s = await supabaseClient.from('device_status').select('*');
      (s.data || []).forEach(x => status[x.cow_id] = x);
    }
    build(); route(true);
  } catch (e) {
    console.error(e);
    document.getElementById('app-content').innerHTML = `<div class="text-red-400 p-4 bg-red-500/10 rounded-lg">Could not load data. <button class="underline" onclick="load()">Retry</button></div>`;
  }
}

function build() {
  cows = {};
  rows.forEach(r => (cows[r.cow_id] ||= { id: r.cow_id, recs: [] }).recs.push(r));
  Object.keys(status).forEach(id => cows[id] ||= { id, recs: [] });
  Object.values(cows).forEach(c => {
    c.recs.sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));
    c.latest = c.recs.at(-1);
    const l24 = c.recs.slice(-12), old = c.recs.slice(0, -12);
    c.eat24 = sum(l24, r => r.eating_minutes); c.ly24 = sum(l24, r => r.lying_minutes);
    c.rum24 = sum(l24, rum); c.act24 = sum(l24, r => r.others_minutes);
    c.rumBase = old.length >= 12 ? sum(old, rum) / old.length * 12 : null;     // 7-day average per 24 h
    c.seen = status[c.id]?.last_upload || c.latest?.recorded_at || null;
    const m = c.seen ? (Date.now() - new Date(c.seen)) / 6e4 : 1e9;
    c.state = m < 100 ? 'online' : m < 240 ? 'delayed' : 'offline';          // uploads are hourly
    c.alert = c.recs.slice(-3).some(r => r.heat_detected);
    c.lastHeat = [...c.recs].reverse().find(r => r.heat_detected)?.recorded_at || null;
    c.risk = c.latest?.heat_confidence ?? null;
  });
  const off = Object.values(cows).filter(c => c.state === 'offline').length;
  const el = document.querySelector('aside .pulse-dot')?.parentElement;
  if (el) el.innerHTML = `<div class="pulse-dot bg-emerald-500"></div> ${off ? off + ' collar(s) offline' : 'All collars reporting'}`;
}

// --- ROUTER ---
function router(v, p = null) {
  const h = p ? `${v}/${p}` : v;
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}
window.addEventListener('hashchange', () => route());
function route(soft = false) {
  const [v = 'fleet', p = ''] = (location.hash.slice(1) || 'fleet').split('/');
  if (soft && v === 'hardware' && curView === 'hardware') return;           // don't rebuild the 3D view on refresh
  curView = v;
  if (animationId) cancelAnimationFrame(animationId);
  charts.forEach(c => c.destroy()); charts = [];
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.remove('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20'); b.classList.add('text-slate-400'); });
  const nb = document.getElementById(`nav-${v}`);
  if (nb) { nb.classList.remove('text-slate-400'); nb.classList.add('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20'); }
  const el = document.getElementById('app-content');
  if (v === 'hardware') renderHardware(el);
  else if (v === 'profile') renderProfile(el, decodeURIComponent(p));
  else renderFleet(el);
}

// --- FLEET ---
const stat = (label, val, color, icon) => `<div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl flex items-center justify-between">
  <div><div class="text-slate-400 text-xs mb-1 uppercase tracking-wider font-semibold">${label}</div>
  <div class="text-3xl font-bold ${color}">${val}</div></div><i class="fa-solid ${icon} text-xl ${color} opacity-70"></i></div>`;

function cards() {
  const list = Object.values(cows).filter(c => c.id.toLowerCase().includes(filter))
    .sort((a, b) => b.alert - a.alert || a.id.localeCompare(b.id));
  if (!list.length) return `<div class="col-span-full text-center p-8 text-slate-500 bg-dark-800 rounded-2xl border border-dark-700">No collars found.</div>`;
  return list.map(c => `
    <div onclick="router('profile','${esc(c.id)}')" class="${c.alert ? 'bg-red-500/5 border-red-500/50' : 'bg-dark-800 border-dark-700'} border p-5 rounded-2xl cursor-pointer hover:-translate-y-1 hover:shadow-xl transition-all">
      <div class="flex justify-between items-start mb-4">
        <div><h4 class="font-bold text-lg text-white">${esc(c.id)}</h4>
        <p class="text-xs text-slate-500 mt-1"><i class="fa-regular fa-clock mr-1"></i>${c.seen ? 'Last upload ' + ago(c.seen) : 'Waiting for first upload'}</p></div>
        <div class="flex flex-col items-end gap-1">${pill(...STATE[c.state])}${c.alert ? pill('ESTRUS', HEAT) : ''}</div>
      </div>
      <div class="grid grid-cols-3 gap-2 border-t border-dark-700 pt-4 text-center">
        ${[['Rumination', c.rum24], ['Eating', c.eat24], ['Active', c.act24]].map(([k, v]) =>
          `<div><div class="text-[10px] uppercase text-slate-500 font-semibold">${k} 24h</div><div class="font-medium text-white">${Math.round(v)}<span class="text-slate-500 text-xs"> min</span></div></div>`).join('')}
      </div>
    </div>`).join('');
}

function renderFleet(el) {
  const list = Object.values(cows), n = k => list.filter(c => c.state === k).length;
  const alerts = list.filter(c => c.alert).length;
  el.innerHTML = `<div class="fade-in">
    <div class="mb-6"><h2 class="text-3xl font-bold text-white mb-1">Fleet Overview</h2>
    <p class="text-slate-400">${list.length} collar(s) · updates automatically${DEMO ? ' · <b class="text-amber-400">DEMO DATA</b>' : ''}</p></div>
    ${alerts ? `<div class="mb-6 p-4 rounded-xl border border-red-500/50 bg-red-500/10 text-red-300"><i class="fa-solid fa-fire mr-2"></i>${alerts} cow(s) showing estrus signs.</div>` : ''}
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      ${stat('Collars', list.length, 'text-white', 'fa-satellite-dish')}
      ${stat('Online', n('online'), 'text-emerald-500', 'fa-wifi')}
      ${stat('Offline / delayed', n('offline') + n('delayed'), n('offline') ? 'text-amber-400' : 'text-slate-300', 'fa-plug-circle-exclamation')}
      ${stat('Estrus alerts', alerts, alerts ? 'text-red-500' : 'text-emerald-500', 'fa-bell')}
    </div>
    <div class="flex justify-between items-center mb-4 gap-4"><h3 class="text-xl font-bold text-white">Collars</h3>
      <input placeholder="Search…" value="${esc(filter)}" oninput="filter=this.value.toLowerCase();document.getElementById('grid').innerHTML=cards()"
      class="bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm w-48 outline-none focus:border-brand-500"></div>
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards()}</div></div>`;
}

// --- PROFILE ---
function renderProfile(el, id) {
  const c = cows[id];
  if (!c) { el.innerHTML = `<p class="text-red-400">Collar not found.</p>`; return; }
  const recs = c.recs.slice(-range);
  const d = c.rumBase ? Math.round((c.rum24 / c.rumBase - 1) * 100) : null;
  const k = (label, val, sub, color = 'text-white') => `<div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl">
    <div class="text-slate-400 text-xs uppercase tracking-wider font-semibold mb-2">${label}</div>
    <div class="text-2xl font-bold ${color}">${val}</div><div class="text-xs text-slate-500 mt-1">${sub}</div></div>`;
  const events = c.recs.filter(r => r.heat_detected).slice(-6).reverse();
  el.innerHTML = `<div class="fade-in">
    <button onclick="router('fleet')" class="text-brand-500 mb-6 text-sm font-semibold flex items-center gap-2 bg-brand-500/10 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-arrow-left"></i> Back to Fleet</button>
    <div class="flex flex-wrap items-center justify-between gap-3 mb-8">
      <div class="flex items-center gap-3"><h2 class="text-3xl font-bold text-white">${esc(c.id)}</h2>${pill(...STATE[c.state])}${c.alert ? pill('ESTRUS ACTIVE', HEAT) : ''}</div>
      <button onclick="exportCsv('${esc(c.id)}')" class="text-sm bg-dark-800 border border-dark-700 px-3 py-2 rounded-lg hover:border-brand-500"><i class="fa-solid fa-download mr-2"></i>Export CSV</button>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      ${k('Rumination, last 24 h', Math.round(c.rum24) + ' min', d === null ? 'Building baseline…' : `${d >= 0 ? '+' : ''}${d}% vs 7-day average`, d !== null && d <= -15 ? 'text-amber-400' : 'text-brand-500')}
      ${k('Eating, last 24 h', Math.round(c.eat24) + ' min', 'Feeding time')}
      ${k('Active, last 24 h', Math.round(c.act24) + ' min', 'Walking / other')}
      ${k('Estrus probability', c.risk === null ? '—' : Math.round(c.risk * 100) + '%', c.lastHeat ? 'Last alert ' + lbl(c.lastHeat) : 'No alerts', c.alert ? 'text-red-400' : 'text-white')}
    </div>
    <div class="flex gap-2 mb-4">${[[12,'24 h'],[36,'3 days'],[84,'7 days']].map(([n, t]) =>
      `<button onclick="range=${n};route()" class="px-3 py-1.5 rounded-lg text-sm border ${range === n ? 'bg-brand-600 border-brand-600 text-white' : 'border-dark-700 text-slate-400'}">${t}</button>`).join('')}</div>
    <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl mb-6"><h3 class="font-bold text-white mb-4">Behavior per 2-hour block</h3><div class="h-72"><canvas id="c1"></canvas></div></div>
    <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl mb-6"><h3 class="font-bold text-white mb-1">Estrus probability</h3>
      <p class="text-xs text-slate-500 mb-4">Alert when the probability stays above 50% for two blocks in a row.</p><div class="h-52"><canvas id="c2"></canvas></div></div>
    <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl"><h3 class="font-bold text-white mb-3">Recent alerts</h3>
      ${events.length ? events.map(r => `<div class="text-sm text-slate-300 py-1 border-b border-dark-700">${lbl(r.recorded_at)} <span class="text-slate-500">· ${Math.round((r.heat_confidence || 0) * 100)}%</span></div>`).join('') : '<p class="text-sm text-slate-500">No alerts yet.</p>'}</div></div>`;

  const x = recs.map(r => lbl(r.recorded_at)), tick = { color: '#94a3b8', maxTicksLimit: 8 }, grid = { color: '#334155' };
  charts.push(new Chart(document.getElementById('c1'), { type: 'bar',
    data: { labels: x, datasets: BEH.map(([key, name, col]) => ({ label: name, data: recs.map(r => r[key]), backgroundColor: col })) },
    options: { responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true, grid: { display: false }, ticks: tick }, y: { stacked: true, grid, ticks: { color: '#94a3b8' }, title: { display: true, text: 'Minutes', color: '#94a3b8' } } },
      plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', usePointStyle: true } } } } }));
  charts.push(new Chart(document.getElementById('c2'), { type: 'line',
    data: { labels: x, datasets: [
      { label: 'Estrus probability', data: recs.map(r => r.heat_confidence), borderColor: '#38bdf8', backgroundColor: '#38bdf822', fill: true, tension: .3, spanGaps: false, pointRadius: 2 },
      { label: 'Alert level', data: recs.map(() => 0.5), borderColor: '#ef4444', borderDash: [6, 6], pointRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false,
      scales: { x: { grid: { display: false }, ticks: tick }, y: { min: 0, max: 1, grid, ticks: { color: '#94a3b8' } } },
      plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', usePointStyle: true } } } } }));
}

function exportCsv(id) {
  const c = cows[id]; if (!c) return;
  const cols = ['recorded_at', ...BEH.map(b => b[0]), 'heat_detected', 'heat_confidence'];
  const csv = [cols.join(','), ...c.recs.map(r => cols.map(k => r[k] ?? '').join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${id}_behavior.csv`; a.click();
}

// --- DEMO DATA (open the site with ?demo=1) ---
function demo() {
  const out = [], st = {}, now = new Date(); now.setMinutes(0, 0, 0); now.setHours(now.getHours() - now.getHours() % 2);
  ['cow1', 'cow2', 'cow3', 'cow4'].forEach((id, k) => {
    for (let i = 84; i >= 1; i--) {
      const t = new Date(now - i * 72e5), h = t.getHours(), night = h < 6 || h >= 20, hot = k === 1 && i <= 3;
      const e = night ? 4 : 18 + Math.random() * 10, lr = night ? 45 + Math.random() * 15 : 12 + Math.random() * 10,
            sr = night ? 6 : 14 + Math.random() * 8, o = Math.random() * (night ? 5 : 14) + (hot ? 35 : 0);
      out.push({ cow_id: id, recorded_at: t.toISOString(), eating_minutes: e, lying_minutes: Math.max(120 - e - lr - sr - o, 0),
        lying_rumination_minutes: lr, standing_rumination_minutes: sr, others_minutes: o,
        heat_detected: hot, heat_confidence: i <= 70 ? (hot ? .8 : Math.random() * .2) : null });
    }
    st[id] = { cow_id: id, last_upload: new Date(Date.now() - (k === 3 ? 9 * 36e5 : (k + 1) * 8 * 6e4)).toISOString() };
  });
  return { rows: out, status: st };
}

// --- STARTUP ---
let t0;
function refreshSoon() { clearTimeout(t0); t0 = setTimeout(load, 1500); }
function start() {
  load();
  if (!DEMO) {
    supabaseClient.channel('live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cow_behavior_summary' }, refreshSoon)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'device_status' }, refreshSoon)
      .subscribe();
    setInterval(load, 120000);                                              // fallback if realtime drops
  }
}

function renderHardware(container = document.getElementById('app-content')) {
            container.innerHTML = `
                <div class="fade-in h-full flex flex-col min-h-screen pb-10">
                    <div class="mb-6">
                        <h2 class="text-3xl font-bold text-white mb-2">Edge Node Hardware</h2>
                        <p class="text-slate-400">ESP32-C3 SuperMini + BMI160 Wearable Design</p>
                    </div>

                    <div class="flex flex-col lg:flex-row gap-8 flex-1">
                        <!-- 3D Viewer -->
                        <div class="flex-1 bg-dark-800 border border-dark-700 rounded-2xl overflow-hidden flex flex-col shadow-xl">
                            <div class="p-4 border-b border-dark-700 bg-dark-900 flex justify-between items-center">
                                <span class="font-bold text-sm text-slate-300 flex items-center"><i class="fa-solid fa-cube text-brand-500 mr-2"></i> Final Enclosure Render</span>
                                <span class="text-xs text-slate-500 bg-dark-800 px-2 py-1 rounded border border-dark-700">Drag to rotate</span>
                            </div>
                            <div id="canvas-container" class="flex-1 relative bg-gradient-to-br from-[#1e293b] to-[#0b1120] w-full min-h-[450px]"></div>
                        </div>

                        <!-- Specs sidebar -->
                        <div class="w-full lg:w-96 space-y-6">
                            <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl shadow-xl">
                                <h3 class="font-bold mb-5 text-white border-b border-dark-700 pb-3 flex items-center"><i class="fa-solid fa-list-check text-brand-500 mr-2"></i> Technical Specs</h3>
                                <ul class="space-y-4 text-sm">
                                    <li class="flex justify-between items-center"><span class="text-slate-400">MCU</span> <span class="font-bold text-white bg-dark-900 px-2 py-1 rounded border border-dark-700">ESP32-C3 SuperMini</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Architecture</span> <span class="font-medium text-white">32-bit RISC-V</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">IMU Sensor</span> <span class="font-medium text-white">DFRobot BMI160</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Sampling Rate</span> <span class="font-medium text-white">25 Hz capture → 10 Hz model</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Enclosure</span> <span class="font-medium text-white">White / Rounded</span></li>
                                    <!-- Updated Placement text to Right Neck -->
                                    <li class="flex justify-between items-center pt-2 border-t border-dark-700"><span class="text-slate-400">Placement</span> <span class="font-bold text-brand-500">Right Neck</span></li>
                                </ul>
                            </div>
                            
                            <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl shadow-xl">
                                <h3 class="font-bold mb-4 text-white border-b border-dark-700 pb-3 flex items-center"><i class="fa-solid fa-microchip text-brand-500 mr-2"></i> PCB Integration</h3>
                                <p class="text-sm text-slate-400 mb-4 leading-relaxed">Custom 2-layer routing connecting the C3 I2C pins (GPIO 8/9) directly to the BMI160. Optimized for the rounded white enclosure footprint.</p>
                                <div class="w-full h-24 bg-[#0b1120] rounded-lg border border-dark-700 flex items-center justify-center text-xs text-slate-500 relative overflow-hidden shadow-inner">
                                    <div class="absolute inset-0 opacity-[0.15]" style="background-image: repeating-linear-gradient(45deg, #38bdf8 0, #38bdf8 1px, transparent 1px, transparent 10px);"></div>
                                    <span class="z-10 bg-dark-800 px-3 py-1.5 rounded-md border border-dark-700 font-mono shadow-lg text-slate-300">U1 (C3) <i class="fa-solid fa-right-left text-brand-500 mx-3 text-[10px]"></i> U2 (BMI)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(init3D, 100); // Small delay to ensure container is fully rendered in DOM
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(7, 6, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);
            
            const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
            fillLight.position.set(-10, -5, -10);
            scene.add(fillLight);

            const enclosureGroup = new THREE.Group();

            // White material for the main box, very slight gloss
            const whiteMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xf8fafc, 
                roughness: 0.2, 
                metalness: 0.1,
                clearcoat: 0.3
            });
            
            const darkInnerMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.9 
            });

            // Draw a rounded rectangle using THREE.Shape
            const length = 5; 
            const width = 2.5; 
            const depth = 2; 
            const cornerRadius = 0.6; // Pronounced rounded corners
            
            const shape = new THREE.Shape();
            const x = length / 2;
            const y = width / 2;
            
            shape.moveTo(-x + cornerRadius, -y);
            shape.lineTo(x - cornerRadius, -y);
            shape.quadraticCurveTo(x, -y, x, -y + cornerRadius);
            shape.lineTo(x, y - cornerRadius);
            shape.quadraticCurveTo(x, y, x - cornerRadius, y);
            shape.lineTo(-x + cornerRadius, y);
            shape.quadraticCurveTo(-x, y, -x, y - cornerRadius);
            shape.lineTo(-x, -y + cornerRadius);
            shape.quadraticCurveTo(-x, -y, -x + cornerRadius, -y);

            const extrudeSettings = {
                depth: depth,
                bevelEnabled: true,
                bevelSegments: 4,
                steps: 1,
                bevelSize: 0.08,
                bevelThickness: 0.08
            };

            const mainGeom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            mainGeom.center(); // Center around origin
            const mainBox = new THREE.Mesh(mainGeom, whiteMat);
            mainBox.rotation.x = -Math.PI / 2; // Lay flat
            enclosureGroup.add(mainBox);

            // Create a fake hollow inside by placing a dark rounded plane slightly below the top edge
            const innerShape = new THREE.Shape();
            const ix = (length - 0.4) / 2;
            const iy = (width - 0.4) / 2;
            const iradius = cornerRadius - 0.1;
            
            innerShape.moveTo(-ix + iradius, -iy);
            innerShape.lineTo(ix - iradius, -iy);
            innerShape.quadraticCurveTo(ix, -iy, ix, -iy + iradius);
            innerShape.lineTo(ix, iy - iradius);
            innerShape.quadraticCurveTo(ix, iy, ix - iradius, iy);
            innerShape.lineTo(-ix + iradius, iy);
            innerShape.quadraticCurveTo(-ix, iy, -ix, iy - iradius);
            innerShape.lineTo(-ix, -iy + iradius);
            innerShape.quadraticCurveTo(-ix, -iy, -ix + iradius, -iy);

            const innerGeom = new THREE.ShapeGeometry(innerShape);
            const innerPlane = new THREE.Mesh(innerGeom, darkInnerMat);
            innerPlane.rotation.x = -Math.PI / 2;
            innerPlane.position.y = (depth / 2) + 0.05; // Sitting flush at the top edge
            enclosureGroup.add(innerPlane);

            // Add side strap mount (Grey/Black plastic loop)
            const mountMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
            const mountGeom = new THREE.BoxGeometry(0.3, 1.0, 1.2);
            const mount = new THREE.Mesh(mountGeom, mountMat);
            mount.position.set(-length/2 - 0.1, 0, 0);
            
            // Hollow out the mount (visual trick with a plane)
            const holeGeom = new THREE.BoxGeometry(0.35, 0.6, 0.8);
            const hole = new THREE.Mesh(holeGeom, new THREE.MeshBasicMaterial({color: 0x1e293b})); // match bg
            hole.position.set(-length/2 - 0.1, 0, 0);
            
            enclosureGroup.add(mount);
            enclosureGroup.add(hole);

            // Tilt slightly for initial view
            enclosureGroup.rotation.y = -Math.PI / 6;
            scene.add(enclosureGroup);

            // Interaction state
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotation = { x: 0.3, y: -0.5 };
            let currentRotation = { x: 0, y: 0 };

            container.addEventListener('mousedown', (e) => { isDragging = true; });
            container.addEventListener('mouseup', () => { isDragging = false; });
            container.addEventListener('mouseleave', () => { isDragging = false; });
            container.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                    targetRotation.y += deltaMove.x * 0.01;
                    targetRotation.x += deltaMove.y * 0.01;
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, {passive: true});
            container.addEventListener('touchend', () => { isDragging = false; });
            container.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
                    targetRotation.y += deltaMove.x * 0.01;
                    targetRotation.x += deltaMove.y * 0.01;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, {passive: true});

            window.addEventListener('resize', () => {
                if(container) {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                }
            });

            function animate() {
                animationId = requestAnimationFrame(animate);
                
                if (!isDragging) {
                    targetRotation.y += 0.003; 
                }

                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;

                enclosureGroup.rotation.x = currentRotation.x;
                enclosureGroup.rotation.y = currentRotation.y;

                renderer.render(scene, camera);
            }
            animate();
        }

        // --- STARTUP ---
        window.onload = start;

    </script>
</body>
