<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriNode AI | Estrus Telemetry</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase, Chart.js, and Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#38bdf8', 600: '#0284c7' },
                        dark: { 900: '#0b1120', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar & Animations */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        #canvas-container { width: 100%; height: 450px; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .pulse-dot {
            height: 8px; width: 8px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 1);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 font-sans antialiased overflow-hidden flex h-screen">

    <aside class="w-64 bg-dark-800 border-r border-dark-700 flex-col hidden md:flex shrink-0 shadow-xl z-20">
        <div class="p-6 border-b border-dark-700 flex items-center gap-3">
            <div class="bg-brand-500/10 p-2 rounded-lg text-brand-500">
                <i class="fa-solid fa-cow text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">AgriNode AI</h1>
                <p class="text-xs text-brand-500 font-medium">Edge Telemetry</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="router('fleet')" id="nav-fleet" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors bg-brand-600 text-white shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-layer-group w-5"></i> Fleet Dashboard
            </button>
            <button onclick="router('hardware')" id="nav-hardware" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 hover:bg-dark-700 hover:text-white transition-colors">
                <i class="fa-solid fa-microchip w-5"></i> Hardware & Specs
            </button>
        </nav>
        <div class="p-4 border-t border-dark-700">
            <div class="flex items-center gap-2 text-sm text-emerald-400 bg-emerald-400/10 px-3 py-2 rounded-lg border border-emerald-500/20">
                <div class="pulse-dot bg-emerald-500"></div> System Online
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto overflow-x-hidden relative bg-[#0b1120]">
        <!-- Mobile Header -->
        <header class="md:hidden bg-dark-800 border-b border-dark-700 p-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cow text-brand-500"></i>
                <h1 class="font-bold text-white">AgriNode AI</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="router('fleet')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-lg"></i></button>
                <button onclick="router('hardware')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-microchip text-lg"></i></button>
            </div>
        </header>

        <div id="app-content" class="p-6 md:p-8 w-full max-w-7xl mx-auto min-h-full">
            <!-- Content injected via JS -->
            <div class="flex justify-center items-center h-64 w-full">
                <i class="fa-solid fa-circle-notch fa-spin text-brand-500 text-3xl"></i>
            </div>
        </div>
    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://fqvkjulnfmevufqxfyqt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_pfsmnN_CY5YWQPYRohZ-Yg_7o1wtNgZ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GLOBAL STATE ---
        let globalData = [];
        let cows = {}; 
        let activeCow = null;
        let chartInstance = null;
        let scene, camera, renderer, animationId; // For 3D

        // --- DATA PROCESSING ---
        async function fetchInitialData() {
            const { data, error } = await supabaseClient
                .from("cow_behavior_summary")
                .select("*")
                .order("recorded_at", { ascending: false })
                .limit(500); 

            if (error) {
                console.error("DB Error:", error);
                document.getElementById('app-content').innerHTML = `<div class="text-red-500 p-4 bg-red-500/10 rounded-lg">Failed to connect to database. Check console.</div>`;
                return;
            }
            
            globalData = data;
            processCowData();
            router('fleet'); 
            setupRealtime();
        }

        function processCowData() {
            cows = {};
            globalData.forEach(record => {
                if (!cows[record.cow_id]) {
                    cows[record.cow_id] = { records: [], latest: null, lastHeat: null, dailyActive: 0 };
                }
                cows[record.cow_id].records.push(record);
            });

            const todayStr = new Date().toDateString();
            
            Object.keys(cows).forEach(id => {
                const cow = cows[id];
                // Sort newest first
                cow.records.sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));
                cow.latest = cow.records[0];

                // Find last heat
                const heatRecord = cow.records.find(r => r.heat_detected === true);
                cow.lastHeat = heatRecord ? new Date(heatRecord.recorded_at) : null;

                // Sum daily activity
                cow.dailyActive = cow.records
                    .filter(r => new Date(r.recorded_at).toDateString() === todayStr)
                    .reduce((sum, r) => sum + r.others_minutes, 0);
            });
        }

        function setupRealtime() {
            supabaseClient
                .channel("public:cow_behavior_summary")
                .on("postgres_changes", { event: "INSERT", schema: "public", table: "cow_behavior_summary" }, payload => {
                    globalData.unshift(payload.new);
                    processCowData();
                    // Re-render current view seamlessly
                    if (window.location.hash.includes('profile')) {
                        renderProfile(activeCow);
                    } else if (window.location.hash === '#fleet' || window.location.hash === '') {
                        renderFleet();
                    }
                })
                .subscribe();
        }

        function router(view, param = null) {
            window.location.hash = param ? `${view}/${param}` : view;
            const content = document.getElementById('app-content');
            content.innerHTML = ''; 
            
            if (animationId) cancelAnimationFrame(animationId);

            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20');
            }

            if (view === 'fleet') renderFleet(content);
            else if (view === 'hardware') renderHardware(content);
            else if (view === 'profile') renderProfile(param, content);
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '').split('/');
            const view = hash[0] || 'fleet';
            const param = hash[1] || null;
            router(view, param);
        });

        function renderFleet(container = document.getElementById('app-content')) {
            const totalCows = Object.keys(cows).length;
            const cowsInHeat = Object.values(cows).filter(c => c.latest && c.latest.heat_detected).length;
            
            let html = `
                <div class="fade-in">
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white mb-2">Fleet Overview</h2>
                        <p class="text-slate-400">Monitoring ${totalCows} active edge nodes deployed in the field.</p>
                    </div>

                    <!-- Clean 2-card top metric grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-slate-400 text-sm mb-1 uppercase tracking-wider font-semibold"><i class="fa-solid fa-server mr-2 text-brand-500"></i>Active Nodes</div>
                                <div class="text-4xl font-bold text-white">${totalCows}</div>
                            </div>
                            <div class="h-12 w-12 rounded-full bg-brand-500/10 flex items-center justify-center text-brand-500 text-xl">
                                <i class="fa-solid fa-satellite-dish"></i>
                            </div>
                        </div>
                        <div class="bg-dark-800 border ${cowsInHeat > 0 ? 'border-red-500/50 shadow-[0_0_20px_rgba(239,68,68,0.15)]' : 'border-dark-700'} p-6 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-slate-400 text-sm mb-1 uppercase tracking-wider font-semibold"><i class="fa-solid fa-fire mr-2 ${cowsInHeat > 0 ? 'text-red-500' : 'text-emerald-500'}"></i>Active Estrus Alerts</div>
                                <div class="text-4xl font-bold ${cowsInHeat > 0 ? 'text-red-500' : 'text-emerald-500'}">${cowsInHeat}</div>
                            </div>
                            <div class="h-12 w-12 rounded-full ${cowsInHeat > 0 ? 'bg-red-500/10 text-red-500' : 'bg-emerald-500/10 text-emerald-500'} flex items-center justify-center text-xl">
                                <i class="fa-solid fa-bell"></i>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold mb-4 text-white">Node Directory</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            if (totalCows === 0) {
                html += `<div class="col-span-full text-center p-8 text-slate-500 bg-dark-800 rounded-2xl border border-dark-700">No nodes detected in the database yet.</div>`;
            }

            Object.keys(cows).forEach(id => {
                const cow = cows[id];
                const latest = cow.latest;
                const isHeat = latest.heat_detected;
                const heatClass = isHeat ? 'bg-red-500/5 border-red-500/50' : 'bg-dark-800 border-dark-700';
                
                html += `
                    <div onclick="router('profile', '${id}')" class="${heatClass} border p-5 rounded-2xl cursor-pointer hover:-translate-y-1 hover:shadow-xl transition-all duration-300 group">
                        <div class="flex justify-between items-start mb-5">
                            <div>
                                <h4 class="font-bold text-lg text-white group-hover:text-brand-400 transition-colors">${id}</h4>
                                <p class="text-xs text-slate-500 mt-1"><i class="fa-regular fa-clock mr-1"></i> ${new Date(latest.recorded_at).toLocaleTimeString()}</p>
                            </div>
                            ${isHeat ? '<span class="bg-red-500/20 border border-red-500/50 text-red-400 text-xs px-2.5 py-1 rounded-full font-bold animate-pulse">ESTRUS</span>' : '<span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 text-xs px-2.5 py-1 rounded-full font-bold">NORMAL</span>'}
                        </div>
                        <div class="flex justify-between items-end border-t border-dark-700 pt-4">
                            <div>
                                <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-1">Today's Active Time</div>
                                <div class="font-medium text-white">${cow.dailyActive.toFixed(1)} <span class="text-slate-500 text-sm">mins</span></div>
                            </div>
                            <div class="text-brand-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderProfile(cowId, container = document.getElementById('app-content')) {
            activeCow = cowId;
            const cow = cows[cowId];
            if (!cow) {
                container.innerHTML = `<p class="text-red-500">Node not found.</p>`;
                return;
            }

            const latest = cow.latest;
            const lastHeatStr = cow.lastHeat ? new Date(cow.lastHeat).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'No recent history';
            
            const chartData = [...cow.records].reverse().slice(-15); 

            container.innerHTML = `
                <div class="fade-in">
                    <button onclick="router('fleet')" class="text-brand-500 hover:text-brand-400 transition-colors mb-6 text-sm font-semibold flex items-center gap-2 bg-brand-500/10 px-3 py-1.5 rounded-lg w-fit">
                        <i class="fa-solid fa-arrow-left"></i> Back to Fleet
                    </button>
                    
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-white flex items-center gap-3">
                                ${cowId} 
                                ${latest.heat_detected ? '<span class="text-sm bg-red-500 text-white px-3 py-1 rounded-full font-bold shadow-[0_0_15px_rgba(239,68,68,0.4)] animate-pulse"><i class="fa-solid fa-fire mr-1"></i> ESTRUS ACTIVE</span>' : ''}
                            </h2>
                            <p class="text-slate-400 mt-2">Detailed behavioral analytics and predictions</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-dark-700 opacity-30 text-6xl"><i class="fa-solid fa-calendar"></i></div>
                            <div class="text-slate-400 text-xs uppercase tracking-wider font-semibold mb-2 relative z-10">Last Heat Event</div>
                            <div class="text-lg font-bold text-white relative z-10">${lastHeatStr}</div>
                        </div>
                        <div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-dark-700 opacity-30 text-6xl"><i class="fa-solid fa-stopwatch"></i></div>
                            <div class="text-slate-400 text-xs uppercase tracking-wider font-semibold mb-2 relative z-10">Today's Active Time</div>
                            <div class="text-2xl font-bold text-brand-500 relative z-10">${cow.dailyActive.toFixed(1)} <span class="text-sm text-slate-400 font-normal">mins</span></div>
                        </div>
                        <div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-dark-700 opacity-30 text-6xl"><i class="fa-solid fa-bolt"></i></div>
                            <div class="text-slate-400 text-xs uppercase tracking-wider font-semibold mb-2 relative z-10">Current Activity</div>
                            <div class="text-xl font-bold text-white relative z-10">${latest.others_minutes > latest.eating_minutes ? 'Active / Moving' : 'Resting / Feeding'}</div>
                        </div>
                        <div class="bg-dark-800 border border-dark-700 p-5 rounded-2xl relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-dark-700 opacity-30 text-6xl"><i class="fa-solid fa-brain"></i></div>
                            <div class="text-slate-400 text-xs uppercase tracking-wider font-semibold mb-2 relative z-10">Model Confidence</div>
                            <div class="text-2xl font-bold text-white relative z-10">${(latest.heat_confidence * 100).toFixed(0)}%</div>
                        </div>
                    </div>

                    <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl mb-8 shadow-xl">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-white">Behavior Distribution Timeline</h3>
                            <span class="text-xs text-slate-500 bg-dark-900 px-3 py-1 rounded-lg border border-dark-700">Last ${chartData.length} records</span>
                        </div>
                        <div class="h-80 relative w-full">
                            <canvas id="profileChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            const ctx = document.getElementById('profileChart');
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(d => new Date(d.recorded_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})),
                    datasets: [
                        { label: 'Eating', data: chartData.map(d => d.eating_minutes), backgroundColor: '#10b981', borderRadius: 2 },
                        { label: 'Lying', data: chartData.map(d => d.lying_minutes), backgroundColor: '#64748b', borderRadius: 2 },
                        { label: 'Lying Rumination', data: chartData.map(d => d.lying_rumination_minutes), backgroundColor: '#f59e0b', borderRadius: 2 },
                        { label: 'Standing Rumination', data: chartData.map(d => d.standing_rumination_minutes), backgroundColor: '#d97706', borderRadius: 2 },
                        // Changed Walk/Other to Active (Others) per request
                        { label: 'Active (Others)', data: chartData.map(d => d.others_minutes), backgroundColor: '#ef4444', borderRadius: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: '#94a3b8', font: {family: 'Inter, sans-serif'} } },
                        y: { stacked: true, grid: { color: '#334155', borderDash: [5, 5] }, ticks: { color: '#94a3b8' }, title: {display: true, text: 'Duration (Minutes)', color: '#94a3b8'} }
                    },
                    plugins: { 
                        legend: { 
                            position: 'bottom',
                            labels: { color: '#f8fafc', usePointStyle: true, padding: 20, font: {family: 'Inter, sans-serif'} } 
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleColor: '#fff',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12
                        }
                    }
                }
            });
        }

        function renderHardware(container = document.getElementById('app-content')) {
            container.innerHTML = `
                <div class="fade-in h-full flex flex-col min-h-screen pb-10">
                    <div class="mb-6">
                        <h2 class="text-3xl font-bold text-white mb-2">Edge Node Hardware</h2>
                        <p class="text-slate-400">ESP32-C3 SuperMini + BMI160 Wearable Design</p>
                    </div>

                    <div class="flex flex-col lg:flex-row gap-8 flex-1">
                        <!-- 3D Viewer -->
                        <div class="flex-1 bg-dark-800 border border-dark-700 rounded-2xl overflow-hidden flex flex-col shadow-xl">
                            <div class="p-4 border-b border-dark-700 bg-dark-900 flex justify-between items-center">
                                <span class="font-bold text-sm text-slate-300 flex items-center"><i class="fa-solid fa-cube text-brand-500 mr-2"></i> Final Enclosure Render</span>
                                <span class="text-xs text-slate-500 bg-dark-800 px-2 py-1 rounded border border-dark-700">Drag to rotate</span>
                            </div>
                            <div id="canvas-container" class="flex-1 relative bg-gradient-to-br from-[#1e293b] to-[#0b1120] w-full min-h-[450px]"></div>
                        </div>

                        <!-- Specs sidebar -->
                        <div class="w-full lg:w-96 space-y-6">
                            <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl shadow-xl">
                                <h3 class="font-bold mb-5 text-white border-b border-dark-700 pb-3 flex items-center"><i class="fa-solid fa-list-check text-brand-500 mr-2"></i> Technical Specs</h3>
                                <ul class="space-y-4 text-sm">
                                    <li class="flex justify-between items-center"><span class="text-slate-400">MCU</span> <span class="font-bold text-white bg-dark-900 px-2 py-1 rounded border border-dark-700">ESP32-C3 SuperMini</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Architecture</span> <span class="font-medium text-white">32-bit RISC-V</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">IMU Sensor</span> <span class="font-medium text-white">DFRobot BMI160</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Sampling Rate</span> <span class="font-medium text-white">10 Hz Continuous</span></li>
                                    <li class="flex justify-between items-center"><span class="text-slate-400">Enclosure</span> <span class="font-medium text-white">White / Rounded</span></li>
                                    <!-- Updated Placement text to Right Neck -->
                                    <li class="flex justify-between items-center pt-2 border-t border-dark-700"><span class="text-slate-400">Placement</span> <span class="font-bold text-brand-500">Right Neck</span></li>
                                </ul>
                            </div>
                            
                            <div class="bg-dark-800 border border-dark-700 p-6 rounded-2xl shadow-xl">
                                <h3 class="font-bold mb-4 text-white border-b border-dark-700 pb-3 flex items-center"><i class="fa-solid fa-microchip text-brand-500 mr-2"></i> PCB Integration</h3>
                                <p class="text-sm text-slate-400 mb-4 leading-relaxed">Custom 2-layer routing connecting the C3 I2C pins (GPIO 8/9) directly to the BMI160. Optimized for the rounded white enclosure footprint.</p>
                                <div class="w-full h-24 bg-[#0b1120] rounded-lg border border-dark-700 flex items-center justify-center text-xs text-slate-500 relative overflow-hidden shadow-inner">
                                    <div class="absolute inset-0 opacity-[0.15]" style="background-image: repeating-linear-gradient(45deg, #38bdf8 0, #38bdf8 1px, transparent 1px, transparent 10px);"></div>
                                    <span class="z-10 bg-dark-800 px-3 py-1.5 rounded-md border border-dark-700 font-mono shadow-lg text-slate-300">U1 (C3) <i class="fa-solid fa-right-left text-brand-500 mx-3 text-[10px]"></i> U2 (BMI)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(init3D, 100); // Small delay to ensure container is fully rendered in DOM
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(7, 6, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);
            
            const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
            fillLight.position.set(-10, -5, -10);
            scene.add(fillLight);

            const enclosureGroup = new THREE.Group();

            // White material for the main box, very slight gloss
            const whiteMat = new THREE.MeshStandardMaterial({ 
                color: 0xf8fafc, 
                roughness: 0.2, 
                metalness: 0.1,
                clearcoat: 0.3
            });
            
            const darkInnerMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.9 
            });

            // Draw a rounded rectangle using THREE.Shape
            const length = 5; 
            const width = 2.5; 
            const depth = 2; 
            const cornerRadius = 0.6; // Pronounced rounded corners
            
            const shape = new THREE.Shape();
            const x = length / 2;
            const y = width / 2;
            
            shape.moveTo(-x + cornerRadius, -y);
            shape.lineTo(x - cornerRadius, -y);
            shape.quadraticCurveTo(x, -y, x, -y + cornerRadius);
            shape.lineTo(x, y - cornerRadius);
            shape.quadraticCurveTo(x, y, x - cornerRadius, y);
            shape.lineTo(-x + cornerRadius, y);
            shape.quadraticCurveTo(-x, y, -x, y - cornerRadius);
            shape.lineTo(-x, -y + cornerRadius);
            shape.quadraticCurveTo(-x, -y, -x + cornerRadius, -y);

            const extrudeSettings = {
                depth: depth,
                bevelEnabled: true,
                bevelSegments: 4,
                steps: 1,
                bevelSize: 0.08,
                bevelThickness: 0.08
            };

            const mainGeom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            mainGeom.center(); // Center around origin
            const mainBox = new THREE.Mesh(mainGeom, whiteMat);
            mainBox.rotation.x = -Math.PI / 2; // Lay flat
            enclosureGroup.add(mainBox);

            // Create a fake hollow inside by placing a dark rounded plane slightly below the top edge
            const innerShape = new THREE.Shape();
            const ix = (length - 0.4) / 2;
            const iy = (width - 0.4) / 2;
            const iradius = cornerRadius - 0.1;
            
            innerShape.moveTo(-ix + iradius, -iy);
            innerShape.lineTo(ix - iradius, -iy);
            innerShape.quadraticCurveTo(ix, -iy, ix, -iy + iradius);
            innerShape.lineTo(ix, iy - iradius);
            innerShape.quadraticCurveTo(ix, iy, ix - iradius, iy);
            innerShape.lineTo(-ix + iradius, iy);
            innerShape.quadraticCurveTo(-ix, iy, -ix, iy - iradius);
            innerShape.lineTo(-ix, -iy + iradius);
            innerShape.quadraticCurveTo(-ix, -iy, -ix + iradius, -y);

            const innerGeom = new THREE.ShapeGeometry(innerShape);
            const innerPlane = new THREE.Mesh(innerGeom, darkInnerMat);
            innerPlane.rotation.x = -Math.PI / 2;
            innerPlane.position.y = (depth / 2) + 0.05; // Sitting flush at the top edge
            enclosureGroup.add(innerPlane);

            // Add side strap mount (Grey/Black plastic loop)
            const mountMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
            const mountGeom = new THREE.BoxGeometry(0.3, 1.0, 1.2);
            const mount = new THREE.Mesh(mountGeom, mountMat);
            mount.position.set(-length/2 - 0.1, 0, 0);
            
            // Hollow out the mount (visual trick with a plane)
            const holeGeom = new THREE.BoxGeometry(0.35, 0.6, 0.8);
            const hole = new THREE.Mesh(holeGeom, new THREE.MeshBasicMaterial({color: 0x1e293b})); // match bg
            hole.position.set(-length/2 - 0.1, 0, 0);
            
            enclosureGroup.add(mount);
            enclosureGroup.add(hole);

            // Tilt slightly for initial view
            enclosureGroup.rotation.y = -Math.PI / 6;
            scene.add(enclosureGroup);

            // Interaction state
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotation = { x: 0.3, y: -0.5 };
            let currentRotation = { x: 0, y: 0 };

            container.addEventListener('mousedown', (e) => { isDragging = true; });
            container.addEventListener('mouseup', () => { isDragging = false; });
            container.addEventListener('mouseleave', () => { isDragging = false; });
            container.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                    targetRotation.y += deltaMove.x * 0.01;
                    targetRotation.x += deltaMove.y * 0.01;
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });

            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, {passive: true});
            container.addEventListener('touchend', () => { isDragging = false; });
            container.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
                    targetRotation.y += deltaMove.x * 0.01;
                    targetRotation.x += deltaMove.y * 0.01;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, {passive: true});

            window.addEventListener('resize', () => {
                if(container) {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                }
            });

            function animate() {
                animationId = requestAnimationFrame(animate);
                
                if (!isDragging) {
                    targetRotation.y += 0.003; 
                }

                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;

                enclosureGroup.rotation.x = currentRotation.x;
                enclosureGroup.rotation.y = currentRotation.y;

                renderer.render(scene, camera);
            }
            animate();
        }

        // --- STARTUP ---
        window.onload = fetchInitialData;

    </script>
</body>
</html>
